openapi: 3.0.3
info:
  title: SaaS Ticketing & Event Management Core API
  description: >
    Production REST API specification for the SaaS Ticketing & Event Management platform (Codename: AnyPass).
    Engineered with Spring Boot 4, Java 25, PostgreSQL 16 schema-per-tenant isolation, and OWASP ASVS security standards.
  version: 1.0.0
servers:
  - url: https://api.anypass.com/api/v1
    description: Production Server
  - url: http://localhost:8080/api/v1
    description: Local Development Environment

tags:
  - name: Tenants
    description: Multi-tenant organization provisioning and lifecycle
  - name: Authentication
    description: Login, JWT issuance, token rotation, logout, and password recovery
  - name: Users
    description: Operator account management, password updates, and status toggles
  - name: Roles & Permissions
    description: Role-based access control (RBAC) and permission matrix
  - name: Events
    description: Event scheduling, series cloning, exclusivity, and product profiles
  - name: Event Addons
    description: Direct addon assignment to events and series scopes
  - name: Products
    description: Ticket configuration, pricing, validity periods, and stock caps
  - name: Product Addons
    description: Mandatory and optional addon configuration on ticket products
  - name: Addons
    description: Reusable standalone goods and services catalogue
  - name: Skins & Layouts
    description: Visual ticket render templates, layout cloning, and ticket bindings
  - name: Tax & VAT
    description: VAT rate lookup and fiscal compliance

paths:
  # -------------------------------------------------------------------------
  # TENANTS
  # -------------------------------------------------------------------------
  /tenants:
    post:
      tags: [Tenants]
      summary: Provision a new tenant organization
      description: Creates the tenant record and dynamically bootstraps a dedicated PostgreSQL schema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name:
                  type: string
                  example: Acme Entertainment Group
                code:
                  type: string
                  example: acme_group
      responses:
        '201':
          description: Tenant provisioned and schema initialized
        '400':
          description: Validation error or duplicate tenant code
    get:
      tags: [Tenants]
      summary: List all tenant organizations (System Admin)
      responses:
        '200':
          description: List of registered tenants

  /tenants/{id}/status:
    patch:
      tags: [Tenants]
      summary: Toggle tenant active status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '200': { description: Status updated }

  /tenants/{id}:
    delete:
      tags: [Tenants]
      summary: Decommission tenant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Tenant decommissioned }

  # -------------------------------------------------------------------------
  # AUTHENTICATION
  # -------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user credentials
      description: Issues HttpOnly JWT and Refresh Token cookies, or triggers an MFA challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@anypass.com
                password:
                  type: string
                  format: password
                  maxLength: 128
      responses:
        '200':
          description: Authenticated (HttpOnly cookies set)
        '401':
          description: Invalid credentials

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate refresh token & issue new JWT
      description: Synchronized across client tabs via the Web Locks API to eliminate race loops.
      responses:
        '200': { description: Session refreshed and new tokens issued }
        '401': { description: Refresh token expired or revoked }

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Invalidate current user session
      responses:
        '200': { description: Cookies cleared and session terminated }

  /auth/password-reset/request:
    post:
      tags: [Authentication]
      summary: Request password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Reset link dispatched via email }

  /auth/password-reset/validate:
    get:
      tags: [Authentication]
      summary: Validate password reset cryptographic token
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Token is valid }
        '400': { description: Token is invalid or expired }

  /auth/password-reset/confirm:
    post:
      tags: [Authentication]
      summary: Set new password using reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 15, maxLength: 128 }
      responses:
        '200': { description: Password successfully updated }

  # -------------------------------------------------------------------------
  # USERS
  # -------------------------------------------------------------------------
  /users:
    get:
      tags: [Users]
      summary: List all operator users in tenant
      responses:
        '200': { description: Array of user accounts }
    post:
      tags: [Users]
      summary: Create operator account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, firstName, lastName, roleId]
              properties:
                email: { type: string, format: email }
                firstName: { type: string }
                lastName: { type: string }
                roleId: { type: string, format: uuid }
      responses:
        '201': { description: User account created }

  /users/me:
    get:
      tags: [Users]
      summary: Get authenticated operator profile
      responses:
        '200': { description: Current user details and granted permissions }

  /users/me/password:
    patch:
      tags: [Users]
      summary: Change password for currently authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 15 }
      responses:
        '200': { description: Password changed }

  /users/{id}:
    put:
      tags: [Users]
      summary: Update user details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: User updated }
    delete:
      tags: [Users]
      summary: Remove user account
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: User removed }

  /users/{id}/status:
    patch:
      tags: [Users]
      summary: Toggle user active / suspended status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Status updated }

  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Assign role to user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Role assigned }

  # -------------------------------------------------------------------------
  # ROLES & PERMISSIONS
  # -------------------------------------------------------------------------
  /roles:
    get:
      tags: [Roles & Permissions]
      summary: List all defined security roles
      responses:
        '200': { description: Role list with permissions }
    post:
      tags: [Roles & Permissions]
      summary: Create new custom role
      responses:
        '201': { description: Role created }

  /roles/{id}:
    put:
      tags: [Roles & Permissions]
      summary: Update role permissions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Role updated }
    delete:
      tags: [Roles & Permissions]
      summary: Delete role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Role deleted }

  # -------------------------------------------------------------------------
  # EVENTS
  # -------------------------------------------------------------------------
  /events:
    get:
      tags: [Events]
      summary: List all events in current tenant
      responses:
        '200': { description: Array of events }
    post:
      tags: [Events]
      summary: Create event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, date, location]
              properties:
                name: { type: string, maxLength: 255, example: Electronic Beats Festival }
                date: { type: string, format: date-time, example: '2026-10-15T18:00:00' }
                location: { type: string, maxLength: 255, example: Arena Warsaw }
                enforceExclusivity: { type: boolean, default: false }
      responses:
        '201': { description: Event created }

  /events/locations:
    get:
      tags: [Events]
      summary: List previously used event locations (Autocomplete)
      responses:
        '200': { description: Distinct location string array }

  /events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Events]
      summary: Get event details
      responses:
        '200': { description: Event details }
        '404': { description: Event not found }
    put:
      tags: [Events]
      summary: Update event configuration
      responses:
        '200': { description: Event updated }
    delete:
      tags: [Events]
      summary: Soft-delete event
      description: Blocked with HTTP 403 if tickets have been sold (usedTickets > 0).
      responses:
        '204': { description: Event soft-deleted }
        '403': { description: Forbidden - Tickets sold }

  /events/{id}/products:
    put:
      tags: [Events]
      summary: Assign ticket products to event profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Products bound to event }

  /events/{id}/clone:
    post:
      tags: [Events]
      summary: Batch clone event across multiple calendar dates
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newDates]
              properties:
                newDates:
                  type: array
                  maxItems: 366
                  items: { type: string, format: date-time }
      responses:
        '201': { description: Cloned events generated }

  /events/{id}/status:
    patch:
      tags: [Events]
      summary: Toggle event active status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Status updated }

  /events/{id}/exclusivity:
    patch:
      tags: [Events]
      summary: Toggle event exclusivity requirement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Exclusivity updated }

  # -------------------------------------------------------------------------
  # EVENT ADDONS
  # -------------------------------------------------------------------------
  /events/{eventId}/addons:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Event Addons]
      summary: List addons assigned to this event
      responses:
        '200': { description: Event addons }
    put:
      tags: [Event Addons]
      summary: Update event addon assignments and series scope
      responses:
        '200': { description: Addons updated }

  # -------------------------------------------------------------------------
  # PRODUCTS (TICKETS)
  # -------------------------------------------------------------------------
  /products:
    get:
      tags: [Products]
      summary: List all ticket products
      responses:
        '200': { description: Array of products }
    post:
      tags: [Products]
      summary: Create ticket product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, basePrice, validSince, maxEntries, entriesPerScan, productProfileId]
              properties:
                name: { type: string, example: VIP 3-Day Pass }
                basePrice: { type: number, format: decimal, example: 299.00 }
                validSince: { type: string, format: date, example: '2026-10-01' }
                validityDays: { type: integer, example: 30 }
                maxEntries: { type: integer, example: 3 }
                entriesPerScan: { type: integer, example: 1 }
                isLimited: { type: boolean, default: false }
                stockCap: { type: integer, nullable: true, example: 1000 }
                productProfileId: { type: string, format: uuid }
      responses:
        '201': { description: Product created }

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Products]
      summary: Get product details
      responses:
        '200': { description: Product details }
    put:
      tags: [Products]
      summary: Update ticket product
      responses:
        '200': { description: Product updated }
    delete:
      tags: [Products]
      summary: Soft-delete ticket product
      description: Blocked with HTTP 403 if product has existing sales (salesCount > 0).
      responses:
        '204': { description: Product soft-deleted }
        '403': { description: Forbidden - Product has sales }

  /products/{id}/status:
    patch:
      tags: [Products]
      summary: Toggle ticket sales status (active / inactive)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Status updated }

  # -------------------------------------------------------------------------
  # PRODUCT ADDONS
  # -------------------------------------------------------------------------
  /products/{productId}/addons:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Product Addons]
      summary: List addons bound to this ticket product
      responses:
        '200': { description: Product addon bindings }
    put:
      tags: [Product Addons]
      summary: Update product addons (mandatory vs optional)
      responses:
        '200': { description: Addons updated }

  /products/{productId}/available-addons:
    get:
      tags: [Product Addons]
      summary: List addons compatible with this product
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Compatible addons list }

  # -------------------------------------------------------------------------
  # ADDONS CATALOGUE
  # -------------------------------------------------------------------------
  /addons:
    get:
      tags: [Addons]
      summary: List standalone addon catalogue
      responses:
        '200': { description: Array of addons }
    post:
      tags: [Addons]
      summary: Create new addon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name: { type: string, example: VIP Parking Access }
                price: { type: number, format: decimal, example: 45.00 }
                vatRateId: { type: string, format: uuid }
      responses:
        '201': { description: Addon created }

  /addons/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Addons]
      summary: Get addon details
      responses:
        '200': { description: Addon details }
    put:
      tags: [Addons]
      summary: Update addon configuration
      responses:
        '200': { description: Addon updated }
    delete:
      tags: [Addons]
      summary: Soft-delete addon
      responses:
        '204': { description: Addon deleted }

  # -------------------------------------------------------------------------
  # SKINS & LAYOUTS
  # -------------------------------------------------------------------------
  /skins:
    get:
      tags: [Skins & Layouts]
      summary: List all ticket rendering skin templates
      responses:
        '200': { description: Array of skins }
    post:
      tags: [Skins & Layouts]
      summary: Create new skin layout template
      responses:
        '201': { description: Skin template created }

  /skins/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Skins & Layouts]
      summary: Get skin layout canvas configuration
      responses:
        '200': { description: Skin configuration and elements layout JSON }
    put:
      tags: [Skins & Layouts]
      summary: Save layout canvas coordinates and styling
      responses:
        '200': { description: Skin layout saved }
    delete:
      tags: [Skins & Layouts]
      summary: Soft-delete skin
      responses:
        '204': { description: Skin deleted }

  /skins/{id}/clone:
    post:
      tags: [Skins & Layouts]
      summary: Clone existing skin template
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Cloned skin template }

  /skins/{id}/tickets:
    put:
      tags: [Skins & Layouts]
      summary: Bind skin template to ticket kinds
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Bindings updated }

  # -------------------------------------------------------------------------
  # TAX & VAT
  # -------------------------------------------------------------------------
  /vat-rates:
    get:
      tags: [Tax & VAT]
      summary: List available VAT tax rates
      responses:
        '200': { description: VAT rates table }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: jwt
